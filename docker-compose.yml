services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: partner-integration-bff-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/PartnerIntegrationBFF.Api/Dockerfile
    container_name: partner-integration-bff-api
    ports:
      - "8080:8080"
    environment:
      # Double underscore is ASP.NET Core's convention for nested config keys via env vars —
      # equivalent to appsettings.json's "RabbitMq": { "HostName": "rabbitmq" }. "rabbitmq" resolves
      # via Docker Compose's internal DNS to the service above; localhost wouldn't work here since
      # each container has its own network namespace.
      RabbitMq__HostName: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
